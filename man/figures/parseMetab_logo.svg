<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- White background -->
  <rect width="800" height="900" fill="white"/>
  
  <!-- Background circle (light blue metabolic theme) -->
  <circle cx="400" cy="380" r="320" fill="#E8F4F8" stroke="#2C5AA0" stroke-width="3"/>
  
  <!-- Connecting lines (metabolic pathways) - drawn first for layering -->
  <line x1="240" y1="280" x2="400" y2="180" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  <line x1="560" y1="280" x2="400" y2="180" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  <line x1="240" y1="280" x2="280" y2="350" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  <line x1="560" y1="280" x2="520" y2="350" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  <line x1="400" y1="180" x2="280" y2="350" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  <line x1="400" y1="180" x2="520" y2="350" stroke="#4ECDC4" stroke-width="20" opacity="0.6"/>
  
  <!-- Metabolic pathway network nodes (red nodes) -->
  <circle cx="240" cy="280" r="20" fill="#FF6B6B" stroke="#CC3333" stroke-width="2" opacity="0.85"/>
  <circle cx="560" cy="280" r="20" fill="#FF6B6B" stroke="#CC3333" stroke-width="2" opacity="0.85"/>
  <circle cx="400" cy="180" r="24" fill="#FF6B6B" stroke="#CC3333" stroke-width="2" opacity="0.85"/>
  <circle cx="280" cy="350" r="16" fill="#FF8C42" stroke="#CC5522" stroke-width="2" opacity="0.85"/>
  <circle cx="520" cy="350" r="16" fill="#FF8C42" stroke="#CC5522" stroke-width="2" opacity="0.85"/>
  
  <!-- DNA/Omics elements on sides (vertical lines) -->
  <line x1="120" y1="280" x2="120" y2="480" stroke="#95E1D3" stroke-width="24" opacity="0.7"/>
  <line x1="680" y1="280" x2="680" y2="480" stroke="#95E1D3" stroke-width="24" opacity="0.7"/>
  
  <!-- Analysis triangle (representing data analysis) -->
  <polygon points="400,240 360,300 440,300" fill="#A8E6CF" stroke="#2C5AA0" stroke-width="2" opacity="0.85"/>
  
  <!-- Additional central analysis indicators -->
  <circle cx="400" cy="380" r="12" fill="#2C5AA0" opacity="0.3"/>
  
  <!-- Package name -->
  <text x="400" y="650" font-size="72" font-weight="bold" text-anchor="middle" fill="#2C5AA0" font-family="Arial, sans-serif">parseMetab</text>
  
  <!-- Subtitle -->
  <text x="400" y="720" font-size="28" text-anchor="middle" fill="#4ECDC4" font-family="Arial, sans-serif" font-style="italic">Metabolic Activity Analysis</text>
  
  <!-- Version -->
  <text x="400" y="770" font-size="20" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif">v1.0.0</text>
  
  <!-- Decorative elements -->
  <circle cx="400" cy="380" r="340" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.5"/>
</svg>
